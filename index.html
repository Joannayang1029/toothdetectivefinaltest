<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code 小遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="homeBtn" class="home-button">
            <img src="" alt="返回首頁">
        </button>

        <div id="startScreen" class="screen">
            <img id="startPageImage" src="" alt="遊戲首頁">
        </div>

        <div id="scannerScreen" class="screen" style="display: none;">
            <div id="scanner" class="scanner-container"></div>
            <button id="stopBtn" class="stop-button">停止掃描</button>
        </div>

        <div id="resultScreen" class="screen" style="display: none;">
            <div class="result-content">
                <img id="displayImage" src="" alt="掃描結果圖片">
                <h2 id="message"></h2>
                <button id="restartBtn" class="restart-button">再次掃描</button>
            </div>
        </div>


        <div id="pageScreen" class="screen" style="display: none; background: #000;">
            <video id="bgVideo" class="page-video" loop muted playsinline></video>
            
            <video id="wavingVideo" class="page-video" loop muted playsinline></video>
            
            <img id="dialogImage" class="dialog-img" src="" alt="對話框">
            
            <div id="dialogText" class="dialog-text"></div>

            <img id="pageImage" src="" alt="故事頁面" style="width:100%; height:100%; object-fit: contain;">
            
            <button id="gameStartBtn" class="game-start-btn">開始測驗</button>

            <button id="analysisBtn" class="analysis-btn" style="display: none;">
                測驗分析
            </button>
        </div>

        <div id="gameScreen" class="screen" style="display: none; background: #000;">
            <div class="game-container">
                <div class="progress-container">
                    <!-- <div id="progressBar" class="progress-bar-image" alt=""></div> -->
                    <img id="progressImage" src="" alt="進度條" style="width:100%; height:100%; object-fit: contain;">
                </div>

                <!-- <div id="questionText" class="question-text"></div>-->
                <div id="questionText" class="question-text">
                    <div id="questionContent" class="question-content"></div>
                </div>

                <div class="options-container">
                    <button id="optionA" class="option-btn"></button>
                    <button id="optionB" class="option-btn"></button>
                    <button id="optionC" class="option-btn"></button>
                </div>

                <div id="feedbackDiv" class="feedback-div"></div>

                <button id="nextQuestionBtn" class="next-question-btn">
                    下一題
                </button>
              </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
